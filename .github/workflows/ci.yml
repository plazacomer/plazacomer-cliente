name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      # build primero: el plugin de Vite compila src/lib/paraglide (gitignored),
      # que check y lint necesitan.
      - run: yarn build
      - run: yarn check
      - run: yarn lint
